name: Ozon schedule runner
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduler
        env:
          SCHEDULER_URL: ${{ secrets.SCHEDULER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SCHEDULER_URL" || { echo 'Missing SCHEDULER_URL'; exit 1; }
          curl --fail-with-body --silent --show-error "$SCHEDULER_URL/api/cron" -H "Authorization: Bearer $CRON_SECRET"
